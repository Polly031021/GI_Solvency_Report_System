# 阳光信保：公司级提取规则（跨年度复用，不按年维护）
#
# 页码依据：2022-2025 实测定位结果（物理页，每份报告 48/48/48/42 页）
#   SOLVENCY_MAIN                 11（四年一致）
#   NON_LIFE_OPERATING_METRICS    13-15（2022=14-15，2023=13-14，2024/2025=14）
#   ACTUAL_CAPITAL                29-34（2022=33-34，2023=31-32，2024=32-33，2025=29）
#   MINIMUM_CAPITAL               34-41（2022=40-41，2023=38-39，2024=39-40，2025=34）
#   THREE_YEAR_INVESTMENT_RETURN  13（2022 年报告无此表；2023-2025=13）
#   LIQUIDITY_MONITORING          12-13（2022/2023=12-13，2024/2025=12）
#
# 封面公司名四年一致：“阳光信用保证保险股份有限公司”。同目录的“阳光产险”
# “阳光农业”是不同法人主体，aliases 不互相收录。
#
# 通用规则的已知缺口由 company.extractor=ygxb 修复，见
# services/company_extractors/ygxb.py 与 plans/company-阳光信保-extraction.md：
#   1. 经营表 2024/2025 整表落在单页，signed region 起止词在页首/页内缺位，
#      页内区域裁剪会把表截到“1.综合成本率”（13 行）为止；这里清空
#      start_item 关闭区域裁剪，由提取器按整页线框表重建 33 行。
#   2. 最低资本 S05 2025 单页 35 行，终止词“最低资本”先命中
#      “寿险业务保险风险最低资本合计”，主表只剩 4 行；同样关闭区域裁剪。
#   3. 实际资本/最低资本续页线框是 4 列（行次+项目+期末+期初），与首页
#      3 列表头不一致，并夹带“【第N页表格分块】”分隔行。
#   4. 流动性监测表锚点页含“（三）流动性风险监测指标”章节标题，pp 11 的
#      流动性风险监管指标表（净现金流/回溯不利偏差率/LCR/压力情景）会被
#      当成目标表块；2023 年该表续到第 13 页（应收分保账款/期末总资产/
#      十、持有关联方资产占比）。
#   5. 2023/2024 第 13 页同时承载“近三年投资收益率”“经营表表头”，
#      整页帧会被拼进目标表。

company:
  canonical: 阳光信保
  aliases: [阳光信用保证保险股份有限公司, 阳光信用保证保险]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  extractor: ygxb
  notes: >-
    六张表物理页稳定在 11 / 13-15 / 29-34 / 34-41 四段；经营表与最低资本表
    2024-2025 均有页内区域误裁，统一关闭区域裁剪改用整页线框表；实际资本
    续页为 4 列并带分块分隔行，流动性监测表首页混入监管指标表块，由专属
    提取器按行次列与“监测指标”表头归一。
  layout_contracts:
    LIQUIDITY_MONITORING:
      headers: [指标名称, 本季度数, 上季度数]
      min_rows: 11
      required_rows:
        - 经营活动净现金流
        - 百元保费经营活动净现金流
        - 特定业务现金流支出占比
        - 规模保费同比增速
        - 现金及流动性管理工具占比
        - 季均融资杠杆比例
        - AA级（含）以下境内固定收益类资产占比
        - 持股比例大于5%的上市股票投资占比
        - 应收款项占比
        - 持有关联方资产占比
    THREE_YEAR_INVESTMENT_RETURN:
      headers: [项目, 数值]
      min_rows: 3
      required_rows: [近三年平均投资收益率, 近三年平均综合投资收益率]

tables:
  SOLVENCY_MAIN:
    expected_pages: [11]
    tolerance: 2
    page_match: prefer

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [13, 14, 15]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    # 清空 start_item：_has_target_region 要求 start/end 同时非空，
    # 关闭页内区域裁剪，保留整页线框帧（2024/2025 单页 33 行）。
    start_item: []
    end_item: [其他渠道签单保费, 其他渠道]
    required_items: [保险业务收入, 净利润, 综合成本率]

  ACTUAL_CAPITAL:
    expected_pages: [29, 31, 32, 33]
    tolerance: 2
    page_match: prefer

  MINIMUM_CAPITAL:
    expected_pages: [34, 38, 39, 40]
    tolerance: 2
    page_match: prefer
    # 2025 单页版本若走页内区域，终止词“最低资本”会命中“寿险业务保险
    # 风险最低资本合计”，主表只剩 4 行；关闭区域裁剪保留整页 35 行。
    start_item: []
    end_item: [最低资本, 最低资本合计]

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [13, 14]
    tolerance: 2
    page_match: prefer
    # 报告原文写作“近三年平均投资收益率/近三年平均综合投资收益率”，
    # 内置标题词是“近三年（综合）投资收益率”，显式补上实测标题。
    anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [11, 12, 13]
    tolerance: 1
    page_match: prefer
    max_pages: 3
    # 内置标题词含“流动性风险监管指标”，第 11 页同时有“（二）监管指标”
    # 与“（三）监测指标”两个章节标题，锚点分被抬到 27.8 而抢走锚点；
    # 这里只保留真正的目标表标题词。
    anchor_terms: [流动性风险监测指标]
    # 第 12 页（监测表首页）2022 年没有章节标题，必须靠内容词过锚点门槛
    # （无标题时要求 content_hits >= 2）。这些行标签只出现在监测表内，
    # 第 11 页的监管指标表（净现金流/回溯不利偏差率/LCR/压力情景）不命中。
    # 2023 年续页（第 13 页）只剩应收分保账款/期末总资产/持有关联方资产
    # 行，需把行标签补进内容词，续页才会越过“主要经营指标”边界。
    content_terms:
      - 规模保费同比增速
      - 综合退保率
      - 现金及流动性管理工具占比
      - 季均融资杠杆比例
      - 特定业务赔付支出
      - 本年累计保费收入
      - 经营活动现金流入本年累计数
      - 经营活动现金流出本年累计数
      - 本年累计经营活动净现金流
      - 百元保费
      - 公司整体赔付支出
      - 当年累计规模保费
      - 应收保费
      - 应收分保账款
      - 期末总资产
      - 持有关联方资产占比

structure_versions:
  - since: 2022
    notes: 原文未披露近三年（综合）投资收益率；第 14 页仅为本季度和本年度累计投资收益率
    tables:
      THREE_YEAR_INVESTMENT_RETURN:
        not_disclosed: true
        notes: 原文没有近三年（综合）投资收益率表
      LIQUIDITY_MONITORING: {expected_pages: [11, 12, 13], tolerance: 0, page_match: prefer}
  - since: 2023
    notes: 近三年收益率表在 13 页；流动性监测表跨 12-13 页
    tables:
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [13], tolerance: 0, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [11, 12, 13], tolerance: 0, page_match: prefer}
  - since: 2024
    notes: 近三年收益率表和流动性监测表第 12 页起
    tables:
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [13], tolerance: 0, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [12], tolerance: 0, page_match: prefer}
  - since: 2025
    notes: 近三年收益率在 13 页；流动性监测表单页 12，单位万元
    tables:
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [13], tolerance: 0, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [12], tolerance: 0, page_match: prefer}
