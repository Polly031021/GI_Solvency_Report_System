# 汇友相互：公司级提取规则（跨年度复用，页码差异走 structure_versions）
#
# 主体：汇友财产相互保险社（相互制财险），文件名“汇友相互.pdf”与 canonical 一致。
# 封面公司名四年均为“汇友财产相互保险社”，但通用封面识别返回空串（见计划文档
# “共享层问题”），批量入口按文件名主干回退，故 aliases 必须覆盖封面全称。
#
# 页码依据：2022-2025 四份四季度报告实测定位（物理页，容差 ±2，prefer）
#   SOLVENCY_MAIN                 2022=10  2023=11  2024=10  2025=10
#   NON_LIFE_OPERATING_METRICS    2022=12  2023=13  2024=12  2025=12
#   ACTUAL_CAPITAL                2022=28  2023=31  2024=29  2025=29
#   MINIMUM_CAPITAL               2022=33-34  2023=36-37  2024=34-35  2025=34-35
#   THREE_YEAR_INVESTMENT_RETURN  2022 原文无该表；2023=13  2024=12  2025=12
#   LIQUIDITY_MONITORING          2022=10-11  2023=11-12  2024=10-11  2025=10-11
#
# 版式：四年完全一致，均为 13 行经营指标（相互制无车险/农险专项行）、
# 31 行实际资本表、49 行最低资本表（跨两页，第 2 页无表头为续页）；
# 无需专属 extractor。金额单位均为元（2022 经营表表头未写单位，数值量级与
# 2023-2025 一致，同为元，非万元）。

company:
  canonical: 汇友相互
  extractor: huiyou
  aliases:
    - 汇友财产相互保险社
    - 汇友互助
    - Hero Mutual Property Insurance Corporation
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  notes: >-
    相互制财险，2022-2025 四期版式一致：偿付能力主表 16 行、经营指标 13 行
    （仅到“综合成本率”）、实际资本表 31 行、最低资本表 49 行跨两页。
    2022 年原文无“近三年（综合）投资收益率”表，属披露缺失，不是提取遗漏；
    2022 经营表表头未标注单位，按数值量级判断为元。

tables:
  SOLVENCY_MAIN:
    expected_pages: [10]
    tolerance: 2
    page_match: prefer
    # 第 10 页同时有流动性监测表，用章节标题钉住主表。
    anchor_terms: [偿付能力充足率指标]
    required_items: [认可资产, 认可负债, 实际资本, 最低资本, 综合偿付能力充足率]
    unit: 元

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [12]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    required_items: [保险业务收入, 净利润, 综合成本率]
    unit: 元

  ACTUAL_CAPITAL:
    expected_pages: [28]
    tolerance: 2
    page_match: prefer
    anchor_terms: [实际资本表]
    required_items: [核心一级资本, 附属一级资本, 实际资本合计]
    unit: 元

  MINIMUM_CAPITAL:
    expected_pages: [33, 34]
    tolerance: 2
    page_match: prefer
    anchor_terms: [最低资本表]
    required_items: [量化风险最低资本, 控制风险最低资本, 最低资本]
    unit: 元

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [12]
    tolerance: 2
    page_match: prefer
    anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]
    required_items: [近三年平均投资收益率, 近三年平均综合投资收益率]
    unit: "%"

  LIQUIDITY_MONITORING:
    expected_pages: [10, 11]
    tolerance: 2
    page_match: prefer
    # 第 10 页为流动性覆盖率（LCR）表、第 11 页为监测指标表，两页同属一个表号；
    # 只写“流动性风险监测指标”会把第 10 页 LCR 行漏掉，故并列两个标题词吸附。
    anchor_terms: [流动性风险监测指标, 流动性覆盖率]
    required_items: [流动性覆盖率, 经营活动净现金流]

structure_versions:
  - since: 2023
    notes: 2023 年报表整体后移一页；近三年收益率首次出现于第 13 页（与经营表同页）
    tables:
      SOLVENCY_MAIN: {expected_pages: [11], tolerance: 2}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [13], tolerance: 2}
      ACTUAL_CAPITAL: {expected_pages: [31], tolerance: 2}
      MINIMUM_CAPITAL: {expected_pages: [36, 37], tolerance: 2}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [13], tolerance: 2}
      LIQUIDITY_MONITORING: {expected_pages: [11, 12], tolerance: 2}

  - since: 2024
    notes: 2024 年页码回到 2022 年位置（主表 10、经营 12、实际资本 29、最低资本 34-35）
    tables:
      SOLVENCY_MAIN: {expected_pages: [10], tolerance: 2}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [12], tolerance: 2}
      ACTUAL_CAPITAL: {expected_pages: [29], tolerance: 2}
      MINIMUM_CAPITAL: {expected_pages: [34, 35], tolerance: 2}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [12], tolerance: 2}
      LIQUIDITY_MONITORING: {expected_pages: [10, 11], tolerance: 2}

  - since: 2025
    notes: 2025 年与 2024 版式页码完全一致，独立成档便于后续漂移只改当年
    tables:
      SOLVENCY_MAIN: {expected_pages: [10], tolerance: 2}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [12], tolerance: 2}
      ACTUAL_CAPITAL: {expected_pages: [29], tolerance: 2}
      MINIMUM_CAPITAL: {expected_pages: [34, 35], tolerance: 2}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [12], tolerance: 2}
      LIQUIDITY_MONITORING: {expected_pages: [10, 11], tolerance: 2}
