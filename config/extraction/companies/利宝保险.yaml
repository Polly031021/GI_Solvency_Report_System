      THREE_YEAR_INVESTMENT_RETURN:
        # 2022 年报原文缺失，放宽窗口后仍未命中即跳过（不造数）
        expected_pages: [16]
        tolerance: 3
      LIQUIDITY_MONITORING:
        expected_pages: [15]
        tolerance: 2

  - since: 2023
    notes: 2023 年报 34 页，实际资本/最低资本两表整体后移 1 页
    tables:
      SOLVENCY_MAIN:
        expected_pages: [13]
