        expected_pages: [16]
        tolerance: 2
      LIQUIDITY_MONITORING:
        expected_pages: [15]
        tolerance: 2

  - since: 2024
    notes: 2024 年报回到 33 页，页码与 2022/2025 一致
    tables:
      SOLVENCY_MAIN:
        expected_pages: [13]
        tolerance: 2
      NON_LIFE_OPERATING_METRICS:
        expected_pages: [15]
        tolerance: 2
      ACTUAL_CAPITAL:
        expected_pages: [29]
        tolerance: 2
      MINIMUM_CAPITAL:
        expected_pages: [32]
        tolerance: 2
