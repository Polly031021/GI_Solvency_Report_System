    notes: 2022 年报 33 页，与 2024/2025 页码一致；无近三年（综合）投资收益率小节
    tables:
      SOLVENCY_MAIN:
        expected_pages: [13]
        tolerance: 2
      NON_LIFE_OPERATING_METRICS:
        expected_pages: [15]
        tolerance: 2
      ACTUAL_CAPITAL:
        expected_pages: [29]
        tolerance: 2
      MINIMUM_CAPITAL:
        expected_pages: [32]
