# 大家财险（大家财产保险有限责任公司）：公司级提取规则
#
# 本目录仅含 2023-2025 三份报告（无 2022），因此 structure_versions
# 从 2023 起维护。两段版式：
#   2023          31 页，六张目标表比 2024-2025 整体后移 1 页
#   2024-2025     32 页，两年页码完全一致
#
# 页码依据：2023-2025 三份报告实测（PDF 物理页）
#   table_id                        2023        2024        2025
#   SOLVENCY_MAIN                   11          10          10
#   NON_LIFE_OPERATING_METRICS      14          13          13
#   ACTUAL_CAPITAL                  26          27          27
#   THREE_YEAR_INVESTMENT_RETURN    13          12          12
#   MINIMUM_CAPITAL                 29          30          30
#   LIQUIDITY_MONITORING            13          12          12
#
# 封面只有“偿付能力季度报告摘要 / 大家财产保险有限责任公司 / 2023 年第4 季度”，
# extract_report_metadata 解析不出公司名（metadata["公司"] 为空）；定位入口用
# 传入的公司名/文件名兜底后即可命中本规则，故 aliases 仍登记法定全称备用。
#
# 通用规则在本公司的三处结构性缺口，全部用 YAML 关闭“页内区域裁剪”修复，
# 标签清洗与单位修正走 dajia extractor：
#   1. 经营表：Profile 的首尾项目（保险服务收入→综合成本率）把整页线框表裁到
#      13 行；清空 start_item/end_item 后走整页帧，30+ 行完整保留（含效益类、
#      规模类指标与 5.1-5.4 分渠道签单保费）。
#   2. 最低资本表：终止词“最低资本合计”命中“寿险业务保险风险最低资本合计”，
#      只剩 4 行（表头+3）；清空后整页帧保留 S05 全表 35 行（表头+34）。
#   3. 2023/2024/2025 的“（三）流动性风险监测指标”与“（四）近三年（综合）
#      投资收益率”同页，且两者相邻。清空 THREE_YEAR 的首尾项目后，整页帧
#      同时保留两张表，按表内关键词各取所需；若不处理，区域裁剪只留收益率
#      两行，流动性监测表会被错配成同一组收益率数据。

company:
  canonical: 大家财险
  aliases: [大家财产保险有限责任公司, 大家财产保险, 大家保险财产保险]
  profile_id: NON_LIFE_SOLVENCY
  layout_contracts:
    SOLVENCY_MAIN:
      headers: [指标名称, 本季度末数, 上季度末数, 下季度末预测数]
      min_rows: 10
      required_rows: [认可资产, 认可负债, 综合偿付能力充足率]
    NON_LIFE_OPERATING_METRICS:
      headers: [指标名称, 本季度数, 本年度累计数]
      min_rows: 20
      required_rows: [保险业务收入, 净利润, 综合成本率, 签单保费]
    ACTUAL_CAPITAL:
      headers: [指标名称, 期末数, 期初数]
      min_rows: 8
      required_rows: [核心一级资本, 实际资本合计]
    MINIMUM_CAPITAL:
      headers: [指标名称, 期末数, 期初数]
      min_rows: 20
      required_rows: [量化风险最低资本, 最低资本]
    LIQUIDITY_MONITORING:
      headers: [指标名称, 本季度数, 上季度数]
      min_rows: 4
      required_rows: [经营活动净现金流]
    THREE_YEAR_INVESTMENT_RETURN:
      headers: [项目, 数值]
      min_rows: 3
      required_rows: [近三年平均投资收益率, 近三年平均综合投资收益率]
  rule_version: 1
  extractor: dajia
  notes: >-
    2023-2025 版式稳定，仅 2023 页码整体比 2024/2025 后移 1 页。
    经营表、最低资本表与同页“流动性监测+近三年收益率”用清空首尾项目的方式
    保留整页帧，避免 Profile 默认区域裁剪丢行、错配。

tables: {}

structure_versions:
  - since: 2023
    notes: 2023 年版式；31 页，主要指标起于第 11 页，最低资本表在第 29 页
    tables:
      SOLVENCY_MAIN:
        expected_pages: [11]
        tolerance: 2
        page_match: prefer
        anchor_terms: [偿付能力充足率]
        required_items: [认可资产, 认可负债, 实际资本, 最低资本, 综合偿付能力充足率]

      NON_LIFE_OPERATING_METRICS:
        expected_pages: [14]
        tolerance: 2
        page_match: prefer
        anchor_terms: [主要经营指标]
        # 清空首尾项目：关闭页内区域裁剪，保留整页线框表（33 行含表头）。
        start_item: []
        end_item: []
        required_items: [保险业务收入, 净利润, 综合成本率, 签单保费]

      ACTUAL_CAPITAL:
