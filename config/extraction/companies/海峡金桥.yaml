      NON_LIFE_OPERATING_METRICS: {expected_pages: [10, 11], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [22], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [27, 28], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [11], tolerance: 1, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [20], tolerance: 2, page_match: prefer}
  - since: 2025
    notes: 2025 年物理页
    tables:
      SOLVENCY_MAIN: {expected_pages: [10], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [11, 12], tolerance: 2, page_match: prefer}
