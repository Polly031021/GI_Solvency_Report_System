# 人保产险：公司级提取规则（跨年度复用，不按年维护）
#
# 页码依据：2022-2025 样例定位结果（物理页，容差 ±2）
#   SOLVENCY_MAIN                 17-18（2022/2023=18，2024/2025=17）
#   NON_LIFE_OPERATING_METRICS    20-21（2023=21-22，2025 修正后=20-21）
#   ACTUAL_CAPITAL                34-36（2022=34-35，2023/2024/2025=35-36）
#   MINIMUM_CAPITAL               40-43（逐年 +1 漂移）
#   THREE_YEAR_INVESTMENT_RETURN  19-20（2022 无该表）
#   LIQUIDITY_MONITORING          17-19（与偿付能力主表相邻）
#
# 只有表结构大改时才在 structure_versions 追加版本。

company:
  canonical: 人保产险
  aliases: [中国人民财产保险股份有限公司, 人保财险]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  notes: 2022-2025 版式稳定；各表页码逐年小幅漂移，全部落在 ±2 窗口内

tables:
  SOLVENCY_MAIN:
    expected_pages: [17, 18]
    tolerance: 2
    page_match: prefer

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [20, 21]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    required_items: [保险业务收入, 净利润, 综合成本率]

  ACTUAL_CAPITAL:
    expected_pages: [35, 36]
    tolerance: 2
    page_match: prefer

  MINIMUM_CAPITAL:
    expected_pages: [41, 42]
    tolerance: 2
    page_match: prefer

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [19, 20]
    tolerance: 2
    page_match: prefer

  LIQUIDITY_MONITORING:
    expected_pages: [17, 18]
    tolerance: 2
    page_match: prefer
