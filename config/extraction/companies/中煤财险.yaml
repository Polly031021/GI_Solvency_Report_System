# 中煤财险：公司级提取规则（跨年度复用，不按年维护）
#
# 页码依据：2022-2023 季报实测定位（物理页，容差 ±2）；2024/2025 无法定位，见下。
#   TABLE                         2022            2023
#   SOLVENCY_MAIN                 12              13
#   NON_LIFE_OPERATING_METRICS    13-14           15-16
#   ACTUAL_CAPITAL                24-25           26-27
#   MINIMUM_CAPITAL               31-32           33-34
#   THREE_YEAR_INVESTMENT_RETURN  无此表          14
#   LIQUIDITY_MONITORING          13              14
#
# 硬约束（重要）：Data/pdfs(2024)/中煤财险.pdf 与 Data/pdfs(2025)/中煤财险.pdf 是
# 扫描件——逐页 get_text() 仅第 1 页有 76/79 个字符（封面），其余页 0 字符且每页
# 恰好 1 张整页图片；本机无 tesseract/pytesseract/easyocr/paddleocr，pymupdf 的
# get_textpage_ocr 无引擎可用。因此 2024/2025 两年**无法**从文本层提取，任何数值
# 只能靠外部 OCR 或替换为可检索 PDF 后重跑。这两年的 expected_pages 为 2023 版式
# 的外推估计（2024 全文 33 页、2025 全文 35 页，比 2023 的 34 页各差 1 页），
# 未经核对，跑批时必然 0 命中，属数据源缺陷而非规则缺陷。
#
# 2022 年无“近三年平均投资收益率”表（全册无“近三年”字样），属原文披露缺失。
# 2022/2023 实际资本表、最低资本表均为两页且续页无表头，故窗口给到 [n, n+1]。
# 金额单位：经营/偿付能力指标表为万元，实际资本表/最低资本表表内标注“单位：元”。

company:
  canonical: 中煤财险
  extractor: zhongmei
  aliases: [中煤财产, 中煤财产保险股份有限公司]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  layout_contracts:
    SOLVENCY_MAIN:
      headers: [指标名称, 本季度末数, 上季度末数, 基本情景下下季度预测数]
      min_rows: 10
      required_rows: [认可资产, 认可负债, 实际资本, 最低资本, 综合偿付能力充足率]
    NON_LIFE_OPERATING_METRICS:
      headers: [指标名称, 本季度数, 本年度累计数]
      min_rows: 15
      required_rows: [保险业务收入, 净利润, 综合成本率]
    ACTUAL_CAPITAL:
      headers: [行次, 项目, 期末数, 期初数]
      min_rows: 4
      required_rows: [核心一级资本, 实际资本合计]
    MINIMUM_CAPITAL:
      headers: [行次, 项目, 期末数, 期初数]
      min_rows: 10
      required_rows: [量化风险最低资本, 控制风险最低资本, 最低资本]
    THREE_YEAR_INVESTMENT_RETURN:
      headers: [指标名称, 指标额]
      min_rows: 2
      required_rows: [近三年平均投资收益率, 近三年平均综合投资收益率]
    LIQUIDITY_MONITORING:
      headers: [指标名称, 本季度数, 上季度数]
      min_rows: 2
      required_rows: [经营活动净现金流]
  notes: >-
    2022-2023 两期版式稳定，2023 起各表整体后移一页；2024/2025 报告为纯扫描件
    （无文本层、无可用 OCR 引擎），两年数据缺失属数据源问题。2022 年无近三年
    投资收益率表。偿付能力指标表用章节标题“偿付能力指标”钉住，避免命中封面目录。

tables:
  SOLVENCY_MAIN:
    expected_pages: [12]
    tolerance: 2
    page_match: prefer
    anchor_terms: [偿付能力指标]
    required_items: [认可资产, 认可负债, 实际资本, 最低资本, 核心偿付能力充足率, 综合偿付能力充足率]

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [13, 14]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    start_item: [保险业务收入]
    end_item: [综合成本率]
    required_items: [保险业务收入, 净利润, 综合成本率]

  ACTUAL_CAPITAL:
    expected_pages: [24, 25]
    tolerance: 2
    page_match: prefer
    anchor_terms: [实际资本表]
    required_items: [实际资本合计]

  MINIMUM_CAPITAL:
    expected_pages: [31, 32]
    tolerance: 2
    page_match: prefer
    anchor_terms: [最低资本表]
    required_items: [最低资本]

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [14]
    tolerance: 2
    page_match: prefer
    anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]
    required_items: [近三年平均投资收益率, 近三年平均综合投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [13]
    tolerance: 2
    page_match: prefer
    anchor_terms: [流动性风险监测指标]

structure_versions:
  - since: 2023
    notes: 2023 年各表整体后移一页；近三年收益率表首次出现（原文 2022 缺失）
    tables:
      SOLVENCY_MAIN: {expected_pages: [13], tolerance: 2}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [15, 16], tolerance: 2}
      ACTUAL_CAPITAL: {expected_pages: [26, 27], tolerance: 2}
      MINIMUM_CAPITAL: {expected_pages: [33, 34], tolerance: 2}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [14], tolerance: 2}
      LIQUIDITY_MONITORING: {expected_pages: [14], tolerance: 2}

  - since: 2024
    notes: >-
      2024 为 33 页纯扫描件，页码经本地 OCR 核对；第 27-28 页为上下两张报告页
      拼在一张 PDF 页中的特殊版式，实际资本跨页。
    tables:
      SOLVENCY_MAIN: {expected_pages: [13], tolerance: 2}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [15], tolerance: 1}
      ACTUAL_CAPITAL: {expected_pages: [25, 26], tolerance: 1}
      MINIMUM_CAPITAL: {expected_pages: [30, 31], tolerance: 1}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [14], tolerance: 2}
      LIQUIDITY_MONITORING: {expected_pages: [14], tolerance: 2}

  - since: 2025
    notes: >-
      2025 为 35 页纯扫描件，页码经本地 OCR 核对：主表 13、经营 15、
      实际资本 27-28、最低资本 33-34、投资收益率与流动性均 14。
    tables:
      SOLVENCY_MAIN: {expected_pages: [13], tolerance: 1}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [15], tolerance: 1}
      ACTUAL_CAPITAL: {expected_pages: [27, 28], tolerance: 1}
      MINIMUM_CAPITAL: {expected_pages: [33, 34], tolerance: 1}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [14], tolerance: 1}
      LIQUIDITY_MONITORING: {expected_pages: [14], tolerance: 1}
