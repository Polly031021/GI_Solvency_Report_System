# 浙商财险：公司级提取规则（2022-2025 共用一套版式，仅页码逐年漂移）
#
# 页码依据：dump_tables 四份年报实测（物理页，容差 ±2）
#   SOLVENCY_MAIN                 2022=15  2023=16  2024=16  2025=17
#   NON_LIFE_OPERATING_METRICS    2022=17  2023=19  2024=18-19  2025=20
#   ACTUAL_CAPITAL                2022=15  2023=16  2024=16  2025=17（与 S01 同页）
#   MINIMUM_CAPITAL               2022=36-37  2023=38-39  2024=36-37  2025=41-42
#   THREE_YEAR_INVESTMENT_RETURN  2022 无该表（原文缺失） 2023=18  2024=17  2025=19
#   LIQUIDITY_MONITORING          2022=16  2023=17  2024=17  2025=18
#
# 封面公司名四年一致：“浙商财产保险股份有限公司”，报告期均为 Q4，金额单位“元”。
# 2024 年 S01 表首列金额两栏粘连（“6,775,550,577.676,904,399,328.80”），
# 系 PDF 两列无间隙导致，非页码问题；S02（实际资本明细表）同页取数正常，
# 两表可交叉校验，故 SOLVENCY_MAIN 的关键指标以 S02 为准（见计划文档“已知问题”）。

company:
  canonical: 浙商财险
  aliases: [浙商财产保险股份有限公司, 浙商财产]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  notes: >-
    2022-2025 版式一致：第 1 页封面，之后“偿付能力充足率指标”（S01）与
    “实际资本明细表”（S02）同页；主要经营指标跨两页；最低资本表位于文末。
    2022 年未披露“近三年平均（综合）投资收益率”表，属原文缺失。

tables:
  SOLVENCY_MAIN:
    expected_pages: [15]
    tolerance: 2
    page_match: prefer
    anchor_terms: [偿付能力充足率指标]
    required_items: [实际资本, 最低资本, 综合偿付能力充足率]

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [17]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    required_items: [保险业务收入, 综合成本率, 签单保费]

  ACTUAL_CAPITAL:
    expected_pages: [15]
    tolerance: 2
    page_match: prefer
    anchor_terms: [实际资本]
    required_items: [认可资产, 实际资本, 最低资本]

  MINIMUM_CAPITAL:
    expected_pages: [36, 37]
    tolerance: 2
    page_match: prefer
    anchor_terms: [最低资本表]
    required_items: [最低资本]

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [16]
    tolerance: 2
    page_match: prefer
    anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]
    required_items: [近三年平均投资收益率, 近三年平均综合投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [16]
    tolerance: 2
    page_match: prefer
    anchor_terms: [流动性风险监测指标]

structure_versions:
  - since: 2023
    notes: 2023 年报表整体后移一页；近三年收益率表首次出现于第 18 页
    tables:
      SOLVENCY_MAIN: {expected_pages: [16], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [19], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [16], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [38, 39], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [18], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [17], tolerance: 2, page_match: prefer}

  - since: 2024
    notes: 2024 年 S01/S02 均在 16 页，经营表跨 18-19 页，最低资本表回到 36-37 页
    tables:
      SOLVENCY_MAIN: {expected_pages: [19], tolerance: 2, page_match: prefer, anchor_terms: [偿付能力状况表]}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [18, 19], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [19], tolerance: 2, page_match: prefer, anchor_terms: [偿付能力状况表]}
      MINIMUM_CAPITAL: {expected_pages: [36, 37], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [17], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [17], tolerance: 2, page_match: prefer}

  - since: 2025
    notes: 2025 年报表各表整体后移，最低资本表在 41-42 页
    tables:
      SOLVENCY_MAIN: {expected_pages: [17], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [20], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [17], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [41, 42], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [19], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [18], tolerance: 2, page_match: prefer}
