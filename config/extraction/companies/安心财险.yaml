# 安心财险：公司级提取规则（跨年度复用，不按年维护）
#
# 页码依据：2022/2023 两期报告实测定位（物理页，容差 2）
#   SOLVENCY_MAIN                 2022=11，2023=10
#   NON_LIFE_OPERATING_METRICS    2022=13-15，2023=11-12
#   ACTUAL_CAPITAL                2022=28-29，2023=22
#   MINIMUM_CAPITAL               2022=34，2023=26
#   THREE_YEAR_INVESTMENT_RETURN  2022 年报无该表，2023=11-12
#   LIQUIDITY_MONITORING          2022=13，2023=11-12
#
# canonical 取 PDF 文件主干名“安心财险”（brief §6 硬约束，tests 的
# COMPANY_FILES 也以该键路由）；列表/口语名“安心财产”登记在 aliases，
# 因此 --company 安心财产 在规则层可解析，但 tests 入口仍须用 安心财险。
#
# 该公司 2020 年起处于接管/重组状态，2024 年起不再单独披露偿付能力报告，
# 故仅配置 2022/2023 两个 structure_versions。
#
# 已知版式问题（见 plans/company-安心财险-extraction.md）：
#   1) 2023 经营表与近三年收益率表同页（11-12 页），通用提取把两表混为
#      一个 THREE_YEAR 表（60 行 / 2 blocks），且经营指标行被按单元格
#      切碎（“保险业务收入”值拆成 -466./9/8/-4/3,0/07.44 多格）；
#   2) 主表/资本表数值粘连（如 68,353.2768,983.55），需按列坐标切分。

company:
  canonical: 安心财险
  extractor: anxincaixian
  aliases: [安心财产, 安心财产保险有限责任公司, 安心财产保险]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  notes: >-
    报告文本层为“每单元格一行”的竖排结构，主表与经营表数值常粘连成一格；
    本版仅配置页码窗口与锚点，未挂专属 extractor，通用提取结果需按
    plans/company-安心财险-extraction.md 的核对结论使用。2024 年起无报告。

tables:
  SOLVENCY_MAIN:
    expected_pages: [10, 11]
    tolerance: 2
    page_match: prefer
    anchor_terms: [偿付能力充足率指标, 认可资产]
    required_items: [认可资产, 认可负债, 实际资本, 最低资本, 综合偿付能力充足率]
    unit: 万元

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [11, 12, 13, 14, 15]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    required_items: [保险业务收入, 净利润, 综合成本率]
    unit: 万元

  ACTUAL_CAPITAL:
    expected_pages: [22, 28, 29]
    tolerance: 2
    page_match: prefer
    anchor_terms: [实际资本]
    required_items: [核心一级资本, 实际资本合计]
    unit: 元

  MINIMUM_CAPITAL:
    expected_pages: [26, 34]
    tolerance: 2
    page_match: prefer
    anchor_terms: [最低资本]
    required_items: [量化风险最低资本, 最低资本]
    unit: 元

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [11, 12]
    tolerance: 2
    page_match: prefer
    anchor_terms: [近三年平均投资收益率]
    required_items: [近三年平均投资收益率, 近三年平均综合投资收益率]
    unit: 万元

  LIQUIDITY_MONITORING:
    expected_pages: [11, 12, 13]
    tolerance: 2
    page_match: prefer
    anchor_terms: [流动性风险监管指标]
    required_items: [经营活动净现金流]
    unit: 万元

structure_versions:
  - since: 2022
    notes: 35 页；无“近三年投资收益率”小节；流动性监测与经营表同页（13 页）
    tables:
      SOLVENCY_MAIN: {expected_pages: [11], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [13, 14, 15], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [28, 29], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [34], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [13], tolerance: 2, page_match: prefer}
  - since: 2023
    notes: 27 页；整体前移；经营表与近三年收益率表同页（11-12 页）
    tables:
      SOLVENCY_MAIN: {expected_pages: [10], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [11, 12], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [22], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [26], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [11, 12], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [11, 12], tolerance: 2, page_match: prefer}
