# 鑫安汽车：公司级提取规则（2022-2025 四季报，按年维护页码窗口）
#
# 页码依据：tmp/tools/dump_tables.py 四年实测（物理页，tolerance 2）
#   SOLVENCY_MAIN                 2022=12  2023=11-12  2024=13  2025=13
#   NON_LIFE_OPERATING_METRICS    2022=14  2023=13-14  2024=15-16  2025=15-16
#   ACTUAL_CAPITAL                2022=20-23  2023=20-21  2024=22-23  2025=22-25
#   MINIMUM_CAPITAL               2022=24  2023=23-24  2024=25-26  2025=26
#   THREE_YEAR_INVESTMENT_RETURN  2022 全册无该小节（披露缺失） 2023=14 2024=16 2025=16
#   LIQUIDITY_MONITORING          2022=13  2023=13  2024=14-15  2025=14-15
#
# 版式要点：
#   1) 2023 起主要偿付能力指标表自上一页底部起表（2023 页 11、2024/2025 页 13），
#      窗口需覆盖前一页；2022 单页起表（12）。
#   2) 经营表 2022 仅到“综合投资收益率”（11 行，无手续费/渠道/签单保费续块），
#      2023-2025 在 13-16 页续有渠道与签单保费分块，start/end 用
#      保险业务收入 → 综合投资收益率 只取主表，避免把流动性/签单保费块并进来。
#   3) 实际资本表（S02）跨 3-4 页，含 5-9 个表格分块；区域锚定会截断，
#      清空 start_item/end_item 走整页线框识别（沿用华海财险处理）。
#   4) 最低资本表（S05）四年均从中段险种行起表、跨页续块，同样整页识别；
#      页窗口含分块续页。
#   5) 单位全程为“元”；“-”表示不适用（无核心二级/附属二级资本、无农险/信用保证险等）。
company:
  canonical: 鑫安汽车
  extractor: xinan
  aliases: [鑫安汽车保险股份有限公司]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  notes: >-
    鑫安汽车保险股份有限公司（一汽系），吉林，小型财险公司，车险占比高。
    四年报告均为四季度报告，单位元。2022 年未披露“近三年（综合）投资收益率”，
    属原文缺失，不是提取遗漏。公司无核心二级/附属二级资本，表中以 0 或“-”表示。

tables:
  SOLVENCY_MAIN:
    expected_pages: [12, 13]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要偿付能力指标]
    required_items: [认可资产, 认可负债, 实际资本, 最低资本, 综合偿付能力充足率]

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [14, 15, 16]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    start_item: [保险业务收入, 保险服务收入]
    end_item: [综合投资收益率]
    required_items: [保险业务收入, 净利润, 综合投资收益率]

  ACTUAL_CAPITAL:
    expected_pages: [20, 21, 22, 23]
    tolerance: 2
    page_match: prefer
    anchor_terms: [实际资本表]
    start_item: []
    end_item: []
    required_items: [实际资本]

  MINIMUM_CAPITAL:
    expected_pages: [23, 24, 25, 26]
    tolerance: 2
    page_match: prefer
    anchor_terms: [最低资本表]
    start_item: []
    end_item: []
    required_items: [保险风险-最低资本合计]

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [14, 16]
    tolerance: 2
    page_match: prefer
    anchor_terms: [近三年（综合）投资收益率, 近三年平均投资收益率]
    required_items: [近三年平均投资收益率, 近三年平均综合投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [13, 14, 15]
    tolerance: 2
    page_match: prefer
    anchor_terms: [流动性风险监测指标]
    required_items: [经营活动净现金流]

structure_versions:
  - since: 2022
    notes: 正文 24 页；单页起表；无“近三年（综合）投资收益率”小节；经营表仅 11 行
    tables:
      SOLVENCY_MAIN: {expected_pages: [12], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [14], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [20, 21, 22, 23], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [24], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [13], tolerance: 2, page_match: prefer}
  - since: 2023
    notes: 主要指标表自页 11 底部起表、跨到 12；经营表跨 13-14；近三年收益率首次出现在第 14 页
    tables:
      SOLVENCY_MAIN: {expected_pages: [11, 12], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [13, 14], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [20, 21], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [23, 24], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [14], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [13], tolerance: 2, page_match: prefer}
  - since: 2024
    notes: 正文 26 页；主要指标表跨 13 单页；经营表跨 15-16；实际资本表 22-23
    tables:
      SOLVENCY_MAIN: {expected_pages: [13], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [15, 16], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [22, 23], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [25, 26], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [16], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [14, 15], tolerance: 2, page_match: prefer}
  - since: 2025
    notes: 与 2024 版式一致；实际资本表续到 24-25，最低资本表收在 26 单页
    tables:
      SOLVENCY_MAIN: {expected_pages: [13], tolerance: 2, page_match: prefer}
      NON_LIFE_OPERATING_METRICS: {expected_pages: [15, 16], tolerance: 2, page_match: prefer}
      ACTUAL_CAPITAL: {expected_pages: [22, 23, 24, 25], tolerance: 2, page_match: prefer}
      MINIMUM_CAPITAL: {expected_pages: [26], tolerance: 2, page_match: prefer}
      THREE_YEAR_INVESTMENT_RETURN: {expected_pages: [16], tolerance: 2, page_match: prefer}
      LIQUIDITY_MONITORING: {expected_pages: [14, 15], tolerance: 2, page_match: prefer}
