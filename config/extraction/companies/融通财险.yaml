# 融通财险：公司级提取规则（仅 2025 年一份报告，2025Q4，39 页）
#
# 页码依据：2025 实测物理页（容差 ±2）
#   SOLVENCY_MAIN                16  （S01 偿付能力充足率指标，16 行含“综合偿付能力充足率”）
#   NON_LIFE_OPERATING_METRICS   17-18（主要经营指标（财险），32 行，17 页尾接 18 页“效益类指标”续块）
#   ACTUAL_CAPITAL               30-31（S02 实际资本明细表，32 行，跨页续块无表头）
#   MINIMUM_CAPITAL              36  （S05 最低资本表）
#   THREE_YEAR_INVESTMENT_RETURN 18  （与经营表续块同页，2 行）
#   LIQUIDITY_MONITORING         17  （流动性风险监测指标，16 行，两分块）
#
# 封面公司名：“中国融通财产保险有限公司”，列表名“融通财险”（canonical）。
# 与东吴/比亚迪同属监管“小册子”季报模板（表名 S01/S02/S05、章节 2.x），无需公司 extractor。
#
# 已知版式缺陷（PDF 文本层，非表格结构变化，本规则不做数值修正）：
#   SOLVENCY_MAIN 首列把“1认可资产”等标签与“本季度末数”金额按千分位逗号切碎，
#   如认可资产切成 “4 | 73,408.74538,167.77 | 454,336.24”（即 473,408.74 / 538,167.77 /
#   454,336.24，单位万元），标签列与首个金额粘连、上季度数被并入同格。按行内数字
#   勾稽可还原：认可资产 473,408.74 − 认可负债 165,797.63 = 实际资本 307,611.11；
#   量化风险 29,616.39 + 控制风险 605.66 = 最低资本 30,222.05；实际资本/最低资本 =
#   综合充足率 1017.84%。标准化结果中该表“认可资产/认可负债”两行金额会缺位，
#   以 S02/S05（单位元）与上式勾稽为准，详见 plans/company-融通财险-extraction.md。

company:
  canonical: 融通财险
  aliases: [融通财产保险股份有限公司, 中国融通财产保险有限公司]
  profile_id: NON_LIFE_SOLVENCY
  extractor: rongtong
  rule_version: 1
  notes: >-
    仅 2025 年报告（2025Q4），无往年版式可比；39 页小册子，六表分布 16-18 页（
    经营类）与 30-36 页（资本类）。SOLVENCY_MAIN 表格单位为万元（表头无“元”字样，
    文本层未识别），已显式声明 unit: 万元，避免按元误换算。

tables:
  SOLVENCY_MAIN:
    expected_pages: [16]
    tolerance: 2
    page_match: prefer
    unit: 万元
    # 第 30 页 S02、第 36 页 S05 也含“充足率/最低资本”短词，用章节标题钉住第 16 页。
    anchor_terms: [偿付能力充足率指标]
    required_items: [实际资本, 最低资本, 核心偿付能力充足率, 综合偿付能力充足率]

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [17, 18]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    # 表中“综合成本率”由“2.综合费用率 + 3.综合赔付率”给出且位于第 18 页续块，
    # 显式起止项防止跨页续块被裁掉/续到后文。
    start_item: [保险业务收入]
    end_item: [其他渠道签单保费]
    required_items: [保险业务收入, 净利润, 综合费用率, 综合赔付率, 签单保费]

  ACTUAL_CAPITAL:
    expected_pages: [30, 31]
    tolerance: 2
    page_match: prefer
    anchor_terms: [实际资本明细表]
    required_items: [核心一级资本, 实际资本合计]

  MINIMUM_CAPITAL:
    expected_pages: [36]
    tolerance: 2
    page_match: prefer
    anchor_terms: [最低资本表]
    # 关闭区域优先，改走整页线框识别，避免“寿险业务保险风险最低资本合计”之后被裁掉
    # （同东吴财险 2025 的截断现象，见该司 plan）。
    start_item: []
    end_item: []
    required_items: [量化风险最低资本, 最低资本]

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [18]
    tolerance: 2
    page_match: prefer
    anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]
    required_items: [近三年平均投资收益率, 近三年平均综合投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [17]
    tolerance: 2
    page_match: prefer
    anchor_terms: [流动性风险监测指标]
    required_items: [经营活动净现金流, 经营活动净现金流回溯不利偏差率]

structure_versions:
  - since: 2025
    notes: 2025Q4 单册 39 页，六表实测物理页；后续年报沿用本版式时如页码漂移则加新段
    tables:
      SOLVENCY_MAIN:
        expected_pages: [16]
        tolerance: 2
        page_match: prefer
        unit: 万元
        anchor_terms: [偿付能力充足率指标]
      NON_LIFE_OPERATING_METRICS:
        expected_pages: [17, 18]
        tolerance: 2
        page_match: prefer
        anchor_terms: [主要经营指标]
      ACTUAL_CAPITAL:
        expected_pages: [30, 31]
        tolerance: 2
        page_match: prefer
        anchor_terms: [实际资本明细表]
      MINIMUM_CAPITAL:
        expected_pages: [36]
        tolerance: 2
        page_match: prefer
        anchor_terms: [最低资本表]
      THREE_YEAR_INVESTMENT_RETURN:
        expected_pages: [18]
        tolerance: 2
        page_match: prefer
        anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]
      LIQUIDITY_MONITORING:
