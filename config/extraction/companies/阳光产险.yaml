# 阳光产险：公司级提取规则（跨年度复用，不按年维护）
#
# 页码依据：2022-2025 实测定位结果（物理页）
#   SOLVENCY_MAIN                 12-14（2022/2025=13，2023=14，2024=12）
#   NON_LIFE_OPERATING_METRICS    13-16（2022=14-15，2023=15-16，2024=13-14，2025=14-15）
#   ACTUAL_CAPITAL                21-27（2022=23-24，2023=26-27，2024=21-22，2025=22-23）
#   MINIMUM_CAPITAL               26/28/31（2022/2025=28，2023=31，2024=26）
#   THREE_YEAR_INVESTMENT_RETURN  13-15（2022 年报无该表；2023=15，2024=13，2025=14）
#   LIQUIDITY_MONITORING          13-15（2022=14，2023=15，2024=13，2025=14）
#
# 封面公司名四年一致：“阳光财产保险股份有限公司”（2025 文件名带“（偿付能力）”不影响路由）。
# 同目录的“阳光信保/阳光农业”是不同法人主体，aliases 不收录。
#
# 通用规则的已知缺口由 company.extractor=yangguang 修复，见
# services/company_extractors/yangguang.py 与 plans/company-阳光产险.md：
#   1. 经营表 2023-2025 续页无表格线框，pdfplumber 只能取到半张表；
#   2. 实际资本表续页缺“核心一级资本”签名，被签名过滤丢弃；
#   3. 最低资本表 S05 被 Profile 终止词“最低资本合计”误裁；
#   4. 2023 年近三年投资收益率与经营表同页，整页帧被拼进目标表；
#   5. 流动性表续页帧含“本季度”表头词，被拼成多块；
#   6. 2024 年原文总资产千分位笔误（5,890.140.20）按结构还原。

company:
  canonical: 阳光产险
  aliases: [阳光财产保险股份有限公司, 阳光财险]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  extractor: yangguang
  notes: >-
    六张表的物理页四年稳定在 12-16 / 21-28 / 31 三段；经营表与实际资本表
    都跨页且续页无线框，由专属提取器按文本行与整页线框表重建；最低资本
    S05 单页 36-37 行，由提取器按“行次/项目/期末数/期初数”重建到“4 最低资本”。

tables:
  SOLVENCY_MAIN:
    expected_pages: [12, 13, 14]
    tolerance: 2
    page_match: prefer

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [13, 14, 15, 16]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    # 清空 start_item：_has_target_region 要求 start/end 同时非空，
    # 关闭页内区域裁剪，续页帧原样保留，由提取器按“指标名称”整表重建。
    start_item: []
    end_item: [其他渠道签单保费, 其他渠道]
    required_items: [保险业务收入, 净利润, 综合成本率]

  ACTUAL_CAPITAL:
    expected_pages: [21, 22, 23, 26]
    tolerance: 2
    page_match: prefer

  MINIMUM_CAPITAL:
    expected_pages: [26, 28, 31]
    tolerance: 2
    page_match: prefer

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [13, 14, 15]
    tolerance: 2
    page_match: prefer
    # 报告原文写作“近三年平均投资收益率/近三年平均综合投资收益率”，
    # 内置标题词是“近三年（综合）投资收益率”，显式补上实测标题。
    anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [13, 14, 15]
    tolerance: 2
    page_match: prefer
