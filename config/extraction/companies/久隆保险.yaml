# 久隆保险：公司级提取规则（跨年度复用，不按年维护）
#
# 页码依据：2022-2025 四份四季度报告实测定位（物理页，容差 ±2）
#   SOLVENCY_MAIN                 2022=11  2023=9   2024=9   2025=10
#   NON_LIFE_OPERATING_METRICS    2022=12-13（13 为无表头续页） 2023=11  2024=11  2025=12-13
#   ACTUAL_CAPITAL                2022=20-21（21 为无表头续页） 2023=23  2024=23  2025=26-27
#   MINIMUM_CAPITAL               2022=26  2023=28-29  2024=29-30  2025=33-34
#   THREE_YEAR_INVESTMENT_RETURN  2022 无该表（全册无“近三年”字样） 2023=10  2024=10  2025=11
#   LIQUIDITY_MONITORING          2022=12  2023=10  2024=10  2025=11
#     （2025 第 22 页“管理层分析与讨论”正文也出现“流动性风险监测指标”，
#       靠 expected_pages 窗口把正文页排除在外，勿把 22 页当表页。）
#
# 封面公司名四年一致：“久隆财产保险有限公司”；报告均为四季度报告，金额单位：元。
#
# profile 通用规则与本公司版式不匹配的两处，用 YAML 修正：
#   1) 经营表：profile 以“综合成本率/综合赔付率/费用率”为终止项，会在第 13 行
#      截断，丢掉效益类剩余行、规模类、签单保费、车均保费与分渠道明细。四年表格
#      实际都结束于“其他渠道签单保费”，显式改终止项保留全表；同时清空起止项，
#      走整页线框识别，让表头（指标名称/本季度数/本年累计数）随表保留，
#      否则 2023/2024 因表头缺失会把两个数值列同时当成本季度/累计（口径冲突）。
#   2) 最低资本表：profile 起项“最低资本”会命中表标题“S05-最低资本表”，2022 年
#      区域在第一行后即结束，只取到 3 行；清空起止项走整页线框识别，2022 可完整
#      取到 34 行（含 1.1-1.6、2、3、4 最低资本）。
company:
  canonical: 久隆保险
  aliases: [久隆财产保险有限公司, 久隆财产保险, 久隆财产]
  profile_id: NON_LIFE_SOLVENCY
  rule_version: 1
  extractor: jiulong
  notes: >-
    2022 年经营表首块（第 12 页）只含表头与前两行，其余 30 行在第 13 页且无表头；
    2023/2024 起单页整表。2022 年无近三年投资收益率表，属披露缺失，不是提取遗漏。
    各年主表金额单位为元，由页面“单位：元”识别，不按年硬编码。

tables:
  SOLVENCY_MAIN:
    expected_pages: [9, 10, 11]
    tolerance: 2
    page_match: prefer
    anchor_terms: [偿付能力充足率指标]
    required_items: [认可资产, 实际资本, 最低资本, 核心偿付能力充足率, 综合偿付能力充足率]

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [11, 12]
    tolerance: 2
    page_match: prefer
    anchor_terms: [主要经营指标]
    start_item: []
    end_item: []
    required_items: [保险业务收入, 综合成本率, 签单保费]

  ACTUAL_CAPITAL:
    expected_pages: [20, 23, 26]
    tolerance: 2
    page_match: prefer
    anchor_terms: [实际资本明细表]
    start_item: []
    end_item: []
    required_items: [实际资本合计]

  MINIMUM_CAPITAL:
    expected_pages: [26, 28, 29, 33]
    tolerance: 2
    page_match: prefer
    anchor_terms: [最低资本表]
    start_item: []
    end_item: []
    required_items: [量化风险最低资本, 控制风险最低资本, 最低资本]

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [10, 11]
    tolerance: 2
    page_match: prefer
    anchor_terms: [近三年平均投资收益率, 近三年平均综合投资收益率]
    required_items: [近三年平均投资收益率, 近三年平均综合投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [10, 11, 12]
    tolerance: 2
    page_match: prefer
    anchor_terms: [流动性风险监测指标]
