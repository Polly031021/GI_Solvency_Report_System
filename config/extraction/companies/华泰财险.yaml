# 华泰财险：公司级提取规则（跨年度复用，不按年维护）
#
# 页码依据：2022-2025 四份 Q4 报告实测（PDF 物理页，容差 ±1）
#   SOLVENCY_MAIN                 2022=13 2023=13 2024=12 2025=12
#   NON_LIFE_OPERATING_METRICS    2022=14-15 2023=14-15 2024=13-14 2025=13-14
#   ACTUAL_CAPITAL                2022=26 2023=27 2024=27 2025=27
#   MINIMUM_CAPITAL               2022=30 2023=31 2024=31 2025=31
#   THREE_YEAR_INVESTMENT_RETURN  2022 无 2023=16 2024=15 2025=15
#   LIQUIDITY_MONITORING          2022=13-14 2023=13-14 2024=12-13 2025=12-13
#
# 版式要点（第 1-3 项由 huatai extractor 按页文本重建，见 services/company_extractors/huatai.py）：
#   1) 经营表跨两页：首块只有“保险业务收入/净利润”2 行，续页无表头；且与流动性
#      监测表同页，整页提取会把监测表 11 行误当经营表；
#   2) 流动性页同时含“监管指标”“LCR1/2/3 必测+自测”“监测指标”，整页提取的
#      通用结果会把主表/分块占位行并进来；叶提取按文本拆成 3 个 block；
#   3) 近三年投资收益率 2023-2025 只有正文一句话、没有表格，由 extractor 补建
#      两行窄表；2022 全册无该披露，属披露缺失；
#   4) 最低资本表整页提取即可得 33/34 个数据行（2023 起多“未考虑特征系数前”
#      一行）。必须显式清空 start_item/end_item，否则 Profile 的“最低资本”区域
#      锚点触发页内裁剪，只剩 3-4 行；
#   5) 实际资本表 31 行、主表 16 行通用提取已正确，不做重建。
#
# 单位：主表/实际资本/最低资本为万元；经营表与流动性表单位混杂（万元/元/%），
#       table.unit 置“未识别”，由行标签内联单位决定，避免 EPS、车均保费被放大。

company:
  canonical: 华泰财险
  aliases: [华泰财产保险有限公司, 华泰财产保险]
  profile_id: NON_LIFE_SOLVENCY
  layout_contracts:
    SOLVENCY_MAIN:
      headers: [指标名称, 本季度末数, 上季度末数, 下季度末预测数]
      min_rows: 10
      required_rows: [认可资产, 认可负债, 综合偿付能力充足率]
    NON_LIFE_OPERATING_METRICS:
      headers: [指标名称, 本季度数, 本年度累计数]
      min_rows: 20
      required_rows: [保险业务收入, 净利润, 综合成本率, 签单保费]
    ACTUAL_CAPITAL:
      headers: [指标名称, 期末数, 期初数]
      min_rows: 8
      required_rows: [核心一级资本, 实际资本合计]
    MINIMUM_CAPITAL:
      headers: [指标名称, 期末数, 期初数]
      min_rows: 20
      required_rows: [量化风险最低资本, 最低资本]
    LIQUIDITY_MONITORING:
      headers: [指标名称, 本季度数, 上季度数]
      min_rows: 5
      required_rows: [经营活动净现金流]
    THREE_YEAR_INVESTMENT_RETURN:
      headers: [项目, 数值]
      min_rows: 3
      required_rows: [近三年平均投资收益率, 近三年平均综合投资收益率]
  rule_version: 1
  extractor: huatai
  notes: |
    2022-2025 封面公司名均为“华泰财产保险有限公司”，均为 Q4 报告。
    四年版式一致，仅 2024 起“四、公司主要指标”整体前移 1 页；用 expected_pages
    窗口 ±1 覆盖，不按年拆分 structure_versions。经营表 29 个数据行、2 个分组标题（第十一/十二类），
    流动性输出监管 1 行（回溯不利偏差率，当季度行的本季度/上季度两列）+ 必测 LCR 6 行 + 监测 10 行。
    按国寿口径：丢弃 3 行年度净现金流（本年度累计/上一会计年度/上上会计年度，标准库
    只有季度期间）和 6 行自测压力情景 LCR2/LCR3（标准库无自测编码，会污染必测编码）。

tables:
  SOLVENCY_MAIN:
    expected_pages: [12, 13]
    tolerance: 1
    page_match: prefer
    anchor_terms: [主要偿付能力指标, 公司主要指标]
    # 保留 Profile 的区域定位（整页提取会丢掉标签列）；表头由 extractor 修正。
    required_items: [认可资产, 认可负债, 实际资本, 最低资本, 综合偿付能力充足率]

  NON_LIFE_OPERATING_METRICS:
    expected_pages: [13, 14]
    tolerance: 1
    page_match: prefer
    anchor_terms: [主要经营指标, 经营指标]
    start_item: []
    end_item: []
    required_items: [保险业务收入, 净利润, 综合成本率, 签单保费, 其他渠道签单保费]

  ACTUAL_CAPITAL:
    expected_pages: [26, 27]
    tolerance: 1
    page_match: prefer
    anchor_terms: [实际资本表]
    required_items: [实际资本合计, 核心一级资本]

  MINIMUM_CAPITAL:
    expected_pages: [30, 31]
    tolerance: 1
    page_match: prefer
    anchor_terms: [最低资本表]
    # 显式空列表：关闭 Profile 的“最低资本→最低资本”页内区域裁剪，改为整页提取
    start_item: []
    end_item: []
    required_items: [量化风险最低资本, 最低资本]

  THREE_YEAR_INVESTMENT_RETURN:
    expected_pages: [15, 16]
    tolerance: 1
    page_match: prefer
    anchor_terms: [近三年平均投资收益率, 近三年综合投资收益率]
    start_item: []
    end_item: []
    required_items: [近三年平均投资收益率]

  LIQUIDITY_MONITORING:
    expected_pages: [12, 13, 14, 18, 19]
    tolerance: 1
    page_match: prefer
    anchor_terms: [流动性风险指标, 监管指标, 监测指标]
    start_item: []
    end_item: []
    required_items: [LCR1未来3个月, 经营活动现金流回溯不利偏差率]

structure_versions:
  - since: 2022
    notes: |
      2022-2025 无表结构版本差异，只有页码整体前移（2024 起主表 13→12）。
      经营表固定 2 个分组标题（第十一/十二类）+ 29 个数据行，首块仅 2 行；
      流动性监管段 3 行年度净现金流（丢弃）+ 回溯不利偏差率当季度/过去一季度（只取当季度行）、
      必测与自测 LCR 各 6 行、监测固定 10 行；
      2022 缺近三年披露，其余年份为正文一句；最低资本 2022 为 33 行、2023 起 34 行。
